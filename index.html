<!-- 2) Arranque: tags del kit y de la app, marca de lista con watchdog. -->
<script type="module">
  const L = globalThis.iswcLoader;
  const listo = () => document.documentElement.setAttribute('data-app-ready', '');
  const watchdog = setTimeout(() => { console.warn('[coco] el arranque excedió 6 s; se revela la página'); listo(); }, 6000);
  try {
    if (!L) throw new Error('falta iswcLoader');
    const { KIT_TAGS, tagsArranque } = await import('./dist/cdn/js/kit-tags.min.mjs?v=5l0umj');
    await L.load(...KIT_TAGS, ...tagsArranque());
  } catch (e) {
    console.warn('[coco] arranque', e);
  } finally {
    clearTimeout(watchdog);
    listo();
  }
</script>
